name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Install exactly as Lovable does: bun from bun.lock, the only lockfile (Lovable writes it).
      # A package.json change without its bun.lock fails here, before Lovable sees it.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Paid edge functions refuse anonymous and over-limit callers
        run: deno test --no-lock --allow-read supabase/functions/_shared/
      - run: bunx tsc -p tsconfig.app.json --noEmit
      # The build prerenders every public route and fails if any renders empty.
      - run: bun run build
      - name: Prerendered pages are not empty
        run: |
          for f in dist/index.html dist/curriculum/index.html dist/install/index.html dist/privacy/index.html dist/terms/index.html; do
            grep -q '<div id="root"><' "$f" || { echo "empty root in $f"; exit 1; }
          done
      - name: The published Organization node matches entity.json (+ self-test)
        run: node scripts/check-entity-graph.mjs dist && node scripts/check-entity-graph.mjs --self-test
      - name: Nothing paid - routing config, the doc, the CLAUDE.md line, no unrecorded endpoint (+ self-test)
        run: node scripts/check-llm-routing.mjs && node scripts/check-llm-routing.mjs --self-test
      - name: The live check and the weekly report still behave (self-tests, no network)
        run: node scripts/live-check.mjs --self-test && node scripts/weekly-outcome-report.mjs --self-test
      - name: Search loop refuses retired page paths (workflow engine v1)
        run: |
          git clone --depth 1 --branch v1 https://github.com/seq23/search-loop.git "$RUNNER_TEMP/search-loop-retirement-test"
          SEARCH_LOOP_ENGINE="$RUNNER_TEMP/search-loop-retirement-test" node --test scripts/retired-path.test.mjs
      - name: Locked tables stay insert-only (RLS guard, static + live anon probe)
        run: node scripts/check-rls-lockdown.mjs --live
